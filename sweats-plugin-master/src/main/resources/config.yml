    private-messages: "https://discord.com/api/webhooks/1573991890779373589/nruay_OGlrSiSwyGs5WlJg5mxGE1-dqTYF0_bp-9sSHd5ngH4DivyL6nLd67lLoU314S"
    command-logs: "https://discord.com/api/webhooks/1573991961084563614/_ZlbSc5eEvs5B_xucjDvl-1y8hioDdsC_MVVYqsm8lQ0L5pj0xRq1bjcNrfxAgMrYmyy"
    dupe-logs: "https://discord.com/api/webhooks/1573992031494086787/cXCqvJfTqYtAa9-fe0lJDod8sViogApmAgYrRmCS5ZiuKo27j-uiZEtLBcrHW1yPX3aY"
    console-logs: "https://discord.com/api/webhooks/1573992140449652839/IqRsC_IPi3P5ck1UsMYnyl8_moctLwXOULwEz-fGiLgRzHt6P5m86pZHhQMWHH7gDqG7"
    team-chat-logs: "https://discord.com/api/webhooks/1573992202663886848/aEb-MS2kkLzg51HXNSpNazFQ5DenPlTDhvw1UP_AVRLeXvoIuBePPbBr9Y-EWCuKpB-3"

# ---------------------------------------------------------------------------------------------
# Duplication detection
# ---------------------------------------------------------------------------------------------
# Detection and evidence only. Sweats never deletes items, bans or rolls anything back.
dupe:
  enabled: true
  # Minimum seconds between two reports with the same player and finding code.
  report-cooldown-seconds: 30
  alerts:
    # In-game notice to players with sweats.dupe.alerts.
    in-game: true